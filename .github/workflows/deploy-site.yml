name: Deploy storefront to Cloudflare

# Publishes the React storefront + admin to https://celestialoud.com (and www → apex).
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as deploy-api.yml;
# skips cleanly without them. API: repository variable SITE_API_URL, else https://api.celestialoud.com.

on:
  push:
    branches: [frontend]
    paths: ['frontend/**', '.github/workflows/deploy-site.yml']
  workflow_run:
    workflows: ['Deploy API to Cloudflare']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Normalise Cloudflare credentials
        working-directory: .
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Pasted secrets often carry stray spaces/newlines; a multi-line token is a paste mistake.
          for pair in "CLOUDFLARE_API_TOKEN:$RAW_TOKEN" "CLOUDFLARE_ACCOUNT_ID:$RAW_ACCOUNT"; do
            name="${pair%%:*}"; val="${pair#*:}"
            [ -n "$val" ] || continue
            lines=$(printf '%s\n' "$val" | tr -d '\r' | awk 'NF' | wc -l)
            if [ "$lines" -gt 1 ]; then
              echo "::error::Secret $name has $lines non-empty lines — re-save it with only the value (Settings → Secrets → Actions)."
              exit 1
            fi
            clean=$(printf '%s' "$val" | tr -d '[:space:]')
            echo "::add-mask::$clean"
            echo "$name=$clean" >> "$GITHUB_ENV"
          done
      - name: Verify Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: .
        run: |
          # Prints only the token's public prefix and length, never the value.
          echo "token: ${CLOUDFLARE_API_TOKEN:0:5}… (${#CLOUDFLARE_API_TOKEN} chars), account id: ${#CLOUDFLARE_ACCOUNT_ID} chars"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("verify:", d.get("success"), (d.get("result") or {}).get("status"), d.get("errors")); sys.exit(0 if d.get("success") else 1)' \
            || { echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN. Use the API token (My Profile → API Tokens → your token → Roll), not the Global API Key."; exit 1; }
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("account:", d.get("success"), d.get("errors")); sys.exit(0 if d.get("success") else 1)' \
            || { echo "::error::Token is valid but cannot read CLOUDFLARE_ACCOUNT_ID — check the account ID and that the token includes this account."; exit 1; }
      - name: Check configuration
        id: cfg
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Storefront deploy skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: steps.cfg.outputs.ready == 'true'
      - name: Build
        if: steps.cfg.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_API_URL: ${{ vars.SITE_API_URL || 'https://api.celestialoud.com' }}
      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        working-directory: frontend/cloudflare
        run: npx --yes wrangler@4.160.0 deploy
      - name: Smoke test
        if: steps.cfg.outputs.ready == 'true'
        run: |
          for i in $(seq 1 12); do
            curl -fsS --max-time 15 https://celestialoud.com/ | grep -q '<div id="root">' && ok=1 && break
            echo "waiting for DNS/certificate ($i)…"; sleep 10
          done
          [ -n "$ok" ] || { echo "::warning::celestialoud.com not answering yet (DNS/certificate may still be provisioning)."; exit 0; }
          curl -fsS --max-time 15 https://celestialoud.com/products/royal-oud | grep -q '<div id="root">'
          echo "### Storefront live: https://celestialoud.com" >> "$GITHUB_STEP_SUMMARY"
