# Render Blueprint — temporary test host for the Go API (backend/), while the
# Cloudflare deployment (backend/cloudflare, .github/workflows/deploy-api.yml)
# stays ready for production. Same Dockerfile, same code, same Supabase DB.
#
# Render dashboard → New → Blueprint → pick this repository. You will be asked
# for DATABASE_URL only (Supabase transaction-pooler URI with the password).
# See docs/DEPLOY.md.

services:
  - type: web
    name: celestial-oud-api
    runtime: docker
    plan: free
    region: frankfurt # closest Render region to the Supabase database (Paris, eu-west-3)
    branch: frontend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /readyz
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        sync: false # prompted once in the dashboard; never committed
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      # No PAYMENTS_MODE=mock here: this host shares the production database,
      # so test orders would appear as real paid orders. Checkout is disabled
      # (503) until Stripe keys are set.
      # Render's proxy appends the client IP to X-Forwarded-For.
      - key: TRUST_PROXY
        value: xff-last
      # Preview storefront (github.io) and this API are different sites.
      - key: COOKIE_SAMESITE
        value: None
      - key: PUBLIC_URL
        value: https://brenod.github.io/Celestial-Oud
      - key: CORS_ORIGINS
        value: https://brenod.github.io
      - key: EMAIL_FROM
        value: Celestial Oud <noreply@celestialoud.com>
