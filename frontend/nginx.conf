# Celestial Oud storefront — static SPA.
#
# Designed for many concurrent visitors:
#  * everything is a static file: no per-request compute, no server state
#  * hashed assets under /assets are cached for a year and marked immutable
#  * index.html is never cached, so a deploy is live instantly
#  * gzip on the wire; sendfile/tcp_nopush for cheap file serving
#  * /healthz for load balancers and container orchestrators

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fast static serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Security headers (CSP allows Google Fonts; tighten once the API origin is known)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images and other public files: cache for a day, revalidate.
    location /images/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }

    # App shell: never cache so new releases are picked up immediately.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
